name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_CACHE_KEY: bevy-0.19-v1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
          cache-on-failure: true
      - name: Setup Bevy Linux dependencies
        uses: ./.github/actions/setup-bevy-linux
      - name: Generate test fixtures
        run: python3 tests/fixtures/generate_tile.py
      - name: Test
        run: cargo test --all-targets
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --no-verify
